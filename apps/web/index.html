<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Блокирует рендер, чтобы заставка загрузки ниже была стилизована с первого кадра,
         до загрузки бандла приложения / globals.css. Стили лежат в файле, а не
         инлайном здесь. -->
    <link rel="stylesheet" href="/splash.css" />
    <title>Dazzle Detailing</title>
  </head>
  <body>
    <div id="app">
      <!-- Заставка загрузки: Vue заменяет #app при монтировании. main.ts монтирует
           приложение только после завершения начальной навигации (auth `fetchMe`),
           поэтому заставка заполняет этот промежуток вместо пустого/мигающего кадра. -->
      <div id="app-splash" role="status" aria-label="Загрузка">
        <div class="spinner"></div>
        <div class="label">Dazzle Detailing</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
