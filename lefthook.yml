# Pre-commit-проверка: те же `pnpm lint / fmt:check / typecheck / test`, что и локально,
# запускаются параллельно. Glob-фильтр лишь пропускает весь хук на коммитах только с
# документацией / конфигами — как только в индексе есть `.ts` или `.vue`, каждая команда
# идёт по всему workspace (eslint с текущими конфигами нельзя безопасно нарезать).
#
# Пропустить в экстренном случае: `git commit --no-verify`.
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    lint:
      glob: '*.{ts,vue}'
      run: pnpm lint
    fmt:
      glob: '*.{ts,vue,js,json,yml,yaml}'
      run: pnpm fmt:check
    typecheck:
      glob: '*.{ts,vue}'
      run: pnpm typecheck
    test:
      glob: '*.{ts,vue}'
      run: pnpm test
