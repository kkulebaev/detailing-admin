# Pre-commit gate: same `pnpm lint / typecheck / test` you'd run locally, fired
# in parallel. The glob filter just skips the whole hook on doc-only / config-
# only commits — once a `.ts` or `.vue` is staged, each command runs against the
# full workspace (eslint can't be sliced safely with current configs).
#
# To skip in an emergency: `git commit --no-verify`.
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    lint:
      glob: "*.{ts,vue}"
      run: pnpm lint
    typecheck:
      glob: "*.{ts,vue}"
      run: pnpm typecheck
    test:
      glob: "*.{ts,vue}"
      run: pnpm test
