services:
  postgres:
    image: postgres:18-alpine
    container_name: detailing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: detailing
      POSTGRES_PASSWORD: detailing
      POSTGRES_DB: detailing
    ports:
      - '5432:5432'
    volumes:
      # PG18 хранит данные в подкаталоге мажорной версии и отказывается стартовать,
      # если смонтировать прямо в /var/lib/postgresql/data. Монтируем уровнем выше.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detailing -d detailing']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
